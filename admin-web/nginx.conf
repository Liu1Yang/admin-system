server {
    listen 80;  # 监听 80 端口（HTTP 默认端口）
    server_name localhost;  # 只有访问 localhost 时才走这个配置
    root /usr/share/nginx/html; # 静态文件的根目录
    index index.html; # 默认访问的首页文件

    # Vue SPA：无物理文件时回退 index.html
    location / { # 处理所有页面请求
        try_files $uri $uri/ /index.html;
    }

    # 同源代理后端 API（Docker 网络内 app 服务）
    location /api/ {
        proxy_pass http://app:8080;   # 请求转发给后端（Docker 网络内）
        proxy_http_version 1.1;
        proxy_set_header Host $host;  # 转发时带着原始域名
        proxy_set_header X-Real-IP $remote_addr; # 告诉后端真实客户 IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # 记录 IP 链（Nginx 代理链路）
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 商品封面等静态上传文件
    location /uploads/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    gzip on;  # 开启压缩，加快加载速度
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
