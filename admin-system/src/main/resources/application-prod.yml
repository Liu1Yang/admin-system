# 生产环境配置（--spring.profiles.active=prod）
# 敏感信息通过环境变量注入，勿把真实密码提交到 Git

server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: admin-system
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:admin_system}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:0}
    timeout: 3000ms
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    root: warn
    com.liuyang.admin: info
  file:
    name: ${LOG_FILE:logs/admin-system.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30

# 生产环境关闭接口文档
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

knife4j:
  enable: false

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_ACCESS_EXPIRATION:7200000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

file:
  upload-dir: ${FILE_UPLOAD_DIR:/data/admin-system/uploads}

rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  api-max-requests: ${RATE_LIMIT_API_MAX:100}
  api-window-seconds: ${RATE_LIMIT_API_WINDOW:60}
  login-max-requests: ${RATE_LIMIT_LOGIN_MAX:10}
  login-window-seconds: ${RATE_LIMIT_LOGIN_WINDOW:60}
