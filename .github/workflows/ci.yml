name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-system
    steps:
      - uses: actions/checkout@v4   # ① 拉代码

      - name: Set up JDK 8
        uses: actions/setup-java@v4   # ② 装 JDK
        with:
          java-version: '8'
          distribution: temurin
          cache: maven

      - name: Run tests
        run: mvn -B test   # ③ 跑测试

      - name: Package jar
        run: mvn -B -DskipTests package   # ④ 打包

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin-web/package-lock.json  #  缓存加速

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
